version: 2
updates:
  # Keep GitHub Actions used by the workflows up to date (also clears the
  # Node 20 deprecation warnings by bumping checkout/setup-uv/etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Keep Python dependencies (resolved in uv.lock) up to date.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
